# Important: every field added here must also be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle

# Project
version=0.5.0
group=com.glisco
java_version=25

# Common
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
mod_name=DeathLogger
mod_author=pamquale
mod_id=deathlogger
license=MIT
credits=glisco03 - original DeathLog author
description=Keeps track of your deaths with detailed statistics, inventory previews, and coordinates recovery.
## Minecraft version used by the 'common' project, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric, see https://fabricmc.net/develop/
fabric_version=0.156.0+26.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.37-beta
neoforge_loader_version_range=[4,)

# Better Statistics Screen, optional integration on Fabric and NeoForge.
# Forge has no build of it, so the forge module never sees these.
modmenu_version=20.0.1
betterstats_version=5.5.4+fn-26.2
tcdcommons_version=5.5.4+fn-26.2

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=65.1.0
forge_loader_version_range=[65,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
